# bin/install.sh settings for resident.alerts (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/resident-alerts--prod (DATABASE_PATH, VAPID_*, COINPAY_*).
#
# One SQLite file (plus a geocode cache beside it), so no Postgres.
#
# DOMAINS is empty on purpose: resident.alerts is a Moshpit name, so there is no
# Let's Encrypt certificate to get. Its nginx vhost (/etc/moshpit/templates/
# resident.alerts.conf) proxies to PORT with the Moshpit-issued certificate.
APP=resident-alerts
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8806
HEALTH_PATH=/health
DOMAINS=
POSTGRES=0
ACCESS_LOG=off
